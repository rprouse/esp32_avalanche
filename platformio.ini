; Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB, GT911 touch) - Avalanche forecast display
; See AGENTS.md for board details and the reasoning behind these settings.

[platformio]
default_envs = waveshare_s3_lcd7

[env:waveshare_s3_lcd7]
; pioarduino fork, pinned. 55.03.313 = Arduino core 3.3.13 on ESP-IDF 5.5.6.
; Do NOT bump to the 61.x line (Arduino 4 / IDF 6) without checking that
; ESP32_Display_Panel + ESP32_IO_Expander build there (IDF 6 removed the legacy I2C driver).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
framework = arduino

; ESP32-S3-WROOM-1-N16R8: 16 MB QIO flash, 8 MB octal (OPI) PSRAM
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

; Upload/monitor through the "UART1" USB-C port (CH343P USB-UART -> GPIO43/44).
; The "USB" port (native USB) is muxed with CAN by CH422G EXIO5 and is not used.
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@7.4.3

build_flags =
    -DCORE_DEBUG_LEVEL=3                ; 0 none .. 5 verbose
    -DARDUINO_USB_CDC_ON_BOOT=0         ; Serial = UART0 (the UART1 USB-C port)
    -DBOARD_HAS_PSRAM
    ; LVGL: use include/lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; ESP32_Display_Panel finds include/esp_panel_board_custom_conf.h via the include path
    -I include
